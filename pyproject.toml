[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apr"
description = "Identify a paper's metadata (title, authors, DOI, arXiv ID) from a PDF; JSON on stdout."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "qjsoong" }]
keywords = [
    "pdf",
    "metadata",
    "scholarly",
    "arxiv",
    "doi",
    "crossref",
    "bibtex",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = ["pypdf>=5.0"]
dynamic = ["version"]

[project.scripts]
apr = "apr.cli:main"

[project.urls]
Homepage = "https://github.com/qjsoong/apr"
Issues = "https://github.com/qjsoong/apr/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17", "ty>=0.0.88"]

[tool.hatch.version]
path = "src/apr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/apr"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["apr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra prints the reason for every skip, so a corpus-free CI run shows *why* the
# corpus tests did not run instead of hiding them in a green summary.
addopts = "-q -ra"
markers = [
    "corpus: needs the local PDF corpus (set APR_CORPUS)",
    "network: performs live network requests (set APR_TEST_ALLOW_NETWORK=1)",
]

[tool.ty.environment]
python-version = "3.10"
